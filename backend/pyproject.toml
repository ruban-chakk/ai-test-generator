[project]
name = "ai_test_generator_backend"
version = "0.1.0"
description = "FastAPI backend for enterprise AI test case generation"
authors = [{ name = "AI Test Generator Team", email = "team@example.com" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "psycopg[binary]>=3.2,<4",
  "alembic",
  "python-dotenv",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.3,<1",
  "httpx",
  "python-multipart"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

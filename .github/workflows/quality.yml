name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ai_test_gen
          POSTGRES_PASSWORD: ai_test_gen_pass
          POSTGRES_DB: ai_test_gen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_test_gen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql+asyncpg://ai_test_gen:ai_test_gen_pass@127.0.0.1:5432/ai_test_gen
      PGPASSWORD: ai_test_gen_pass
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: alembic upgrade head
        env:
          POSTGRES_DSN: postgresql+asyncpg://ai_test_gen:ai_test_gen_pass@127.0.0.1:5432/ai_test_gen
      - run: pytest -q tests
      - run: python -m compileall app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
